<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GK KA-Training</title>
  <meta name="description" content="Lernseite für die GK-Klassenarbeit Klasse 9 (Baden-Württemberg): Gemeinde, Politikzyklus, Partizipation, Medien, digitale Medien, Operatoren.">
  <meta name="theme-color" content="#c8372d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E">
  <script>
    // Theme früh setzen, damit nichts flackert
    (function () {
      var t = null;
      try { t = localStorage.getItem('gk:theme'); } catch (e) {}
      if (t) t = JSON.parse(t);
      if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Zur Startseite">

      <span>GK <b>KA-Training</b></span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Themen</a>
      <a href="#/spickzettel" data-nav="spick">Spickzettel</a>

    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel umschalten">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><g stroke-linecap="round"><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"/></g></svg>

    </button>

    <p>GK Klasse 9 · Lernseite zur Klassenarbeit am 25.11. · Fortschritt wird nur in diesem Browser gespeichert.</p>
  </footer>
